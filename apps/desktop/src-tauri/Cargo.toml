[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
kamadak-exif = "0.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
walkdir = "2.5.0"
rayon = "1.12.0"
anyhow = "1.0.104"
tauri-plugin-dialog = "2.8.2"
quick-xml = "0.42.0"
regex = "1.13.1"
blake3 = "1.8.7"
sysinfo = "0.39.6"
tauri-plugin-updater = "2.13.3"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
ureq = "2.12"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
fontdb = "0.24.0"
ab_glyph = "0.2.32"
rawler = "0.8.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 开发模式下 RAW 显影 / 图像编解码保持优化：否则真实 RAW 的去马赛克会让
# 调色预览等待数分钟（debug 未优化）。
[profile.dev.package.rawler]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# 本包在 dev 下也开启优化：调色 / 合成 / 编码等像素级热路径否则慢一个数量级，
# 滑杆交互会从毫秒级退化到秒级。
[profile.dev.package.desktop]
opt-level = 2
